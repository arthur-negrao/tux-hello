[package]
name = "tux-hello"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = { version = "2.5.0" }
v4l = "0.14.0"
ort = "2.0.0-rc.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { 
  version = "1.54.1", 
  features = [
    "rt",
    "rt-multi-thread",
    "io-std",
    "io-util",
    "macros",
    "sync",
    "fs",
    "time",
    "net"
  ]
}
tracing = { version = "0.1.44" }
tracing-subscriber = {
  version = "0.3.23",
  features = [
    "env-filter",
    "fmt"
  ]
}
